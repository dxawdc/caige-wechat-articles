<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国庆渐变头像生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6fa; color: #333; padding: 24px; }
  .card { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 16px;
          padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .left { flex: 1; min-width: 260px; }
  .right { flex: 1; min-width: 260px; }
  canvas { width: 100%; max-width: 360px; border-radius: 12px; border: 1px solid #eee;
           background: #fafafa; display: block; }
  .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; border: none;
         background: #de2929; color: #fff; font-size: 14px; cursor: pointer; margin: 6px 8px 6px 0; }
  .btn.secondary { background: #f0f1f5; color: #444; }
  .modes { margin: 12px 0; }
  .modes label { margin-right: 14px; font-size: 14px; cursor: pointer; }
  .tip { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.7; }
  #downloadBtn { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>国庆渐变头像生成器</h1>
  <div class="sub">纯浏览器本地生成，不上传服务器 —— HTML5 Canvas 方案</div>

  <div class="row">
    <div class="left">
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <button class="btn" onclick="document.getElementById('fileInput').click()">1. 选择你的头像</button>
      <div class="modes">
        <label><input type="radio" name="mode" value="gradient" checked onchange="render()"> 从左到右渐变</label>
        <label><input type="radio" name="mode" value="uniform" onchange="render()"> 整体半透明</label>
      </div>
      <div id="sliderWrap" style="display:none">
        <label style="font-size:13px">国旗不透明度：<span id="alphaVal">45%</span></label>
        <input type="range" id="alphaSlider" min="10" max="90" value="45" style="width:100%" oninput="render()">
      </div>
      <button class="btn" id="downloadBtn" onclick="download()">2. 保存头像</button>
      <div class="tip">
        · 渐变模式：左侧透明露出头像，右侧纯国旗（经典样式）<br>
        · 半透明模式：国旗以统一透明度整体覆盖，可拖滑块调节<br>
        · 图片只在你的浏览器里处理，不会上传到任何服务器
      </div>
    </div>
    <div class="right">
      <canvas id="cv" width="900" height="900"></canvas>
    </div>
  </div>
</div>

<script>
// ---------- 规范五星国旗绘制（30x20 网格，canvas 版） ----------
function drawFlag(ctx, W) {
  const H = W * 2 / 3, cell = W / 30;
  ctx.save();
  ctx.fillStyle = "#DE2922"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#FFDE00";
  star(ctx, 5*cell, 5*cell, 3*cell, null);
  const big = [5*cell, 5*cell];
  star(ctx, 10*cell, 2*cell, 1*cell, big);
  star(ctx, 12*cell, 4*cell, 1*cell, big);
  star(ctx, 12*cell, 7*cell, 1*cell, big);
  star(ctx, 10*cell, 9*cell, 1*cell, big);
  ctx.restore();
}
function star(ctx, cx, cy, r, pointTo) {
  let rot = -Math.PI/2;
  if (pointTo) rot = Math.atan2(pointTo[1]-cy, pointTo[0]-cx);
  ctx.beginPath();
  for (let k = 0; k < 5; k++) {
    const a1 = rot + k*2*Math.PI/5;
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    if (k === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
    const a2 = a1 + Math.PI/5;
    const r2 = r * Math.sin(Math.PI/10) / Math.sin(3*Math.PI/10);
    ctx.lineTo(cx + r2*Math.cos(a2), cy + r2*Math.sin(a2));
  }
  ctx.closePath(); ctx.fill();
}

// ---------- 渐变 alpha 蒙版（离屏 canvas） ----------
function gradientMask(W, H) {
  const m = document.createElement("canvas");
  m.width = W; m.height = H;
  const mc = m.getContext("2d");
  const g = mc.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0,   "rgba(0,0,0,0)");   // 左侧全透明
  g.addColorStop(1,   "rgba(0,0,0,1)");   // 右侧不透明
  mc.fillStyle = g;
  mc.fillRect(0, 0, W, H);
  return m;
}

let avatarImg = null;
document.getElementById("fileInput").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    avatarImg = new Image();
    avatarImg.onload = () => render();
    avatarImg.src = ev.target.result;
  };
  reader.readAsDataURL(f);
});

function render() {
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const S = cv.width;
  ctx.clearRect(0, 0, S, S);

  const mode = document.querySelector('input[name="mode"]:checked').value;
  document.getElementById("sliderWrap").style.display = mode === "uniform" ? "block" : "none";

  // 底图：头像或占位灰底
  if (avatarImg) {
    // 居中裁剪成正方形再绘制
    const w = avatarImg.width, h = avatarImg.height, side = Math.min(w, h);
    ctx.drawImage(avatarImg, (w-side)/2, (h-side)/2, side, side, 0, 0, S, S);
  } else {
    ctx.fillStyle = "#e8e8ee"; ctx.fillRect(0, 0, S, S);
    ctx.fillStyle = "#bbb"; ctx.font = "28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("先选择头像", S/2, S/2);
  }

  // 国旗层（左侧正方形裁剪，保留完整五星）
  const flag = document.createElement("canvas");
  flag.width = S; flag.height = S;
  const fc = flag.getContext("2d");
  const FW = S * 1.5;                      // 3:2 旗面放大画，再左裁
  drawFlag(fc, FW);
  const flagSquare = fc.getImageData(0, 0, S, S);
  fc.putImageData(flagSquare, 0, 0);

  if (mode === "gradient") {
    // 用渐变 alpha 蒙版抠国旗：先画旗，再用 destination-in 与渐变蒙版相乘
    const tmp = document.createElement("canvas");
    tmp.width = S; tmp.height = S;
    const tc = tmp.getContext("2d");
    tc.drawImage(flag, 0, 0);
    tc.globalCompositeOperation = "destination-in";
    tc.drawImage(gradientMask(S, S), 0, 0);
    ctx.drawImage(tmp, 0, 0);
  } else {
    const a = document.getElementById("alphaSlider").value / 100;
    document.getElementById("alphaVal").textContent = Math.round(a*100) + "%";
    ctx.globalAlpha = a;
    ctx.drawImage(flag, 0, 0);
    ctx.globalAlpha = 1;
  }
  document.getElementById("downloadBtn").style.display = "inline-block";
}

function download() {
  const cv = document.getElementById("cv");
  const a = document.createElement("a");
  a.download = "国庆头像.png";
  a.href = cv.toDataURL("image/png");
  a.click();
}

render();
</script>
</body>
</html>
