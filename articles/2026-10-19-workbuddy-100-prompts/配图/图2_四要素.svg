<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330"><rect width="100%" height="100%" fill="#FAFAFE"/>
<rect x="64" y="56" width="96" height="10" rx="5" fill="#DB655A"/>
<text x="64" y="92" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700" fill="#202B54">同一件事，两种说法</text>
<text x="66" y="176" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#5D6485">写清四样东西，它就不用再猜</text>
<rect x="64" y="250" width="1072" height="190" rx="20" fill="#FBEDEB"/>
<text x="96" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#DB655A">只说了目标</text>
<text x="96" y="336" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" fill="#202B54">“帮我整理一下这个表格。”</text>
<text x="96" y="394" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#5D6485">整理成什么样？给谁看？哪些不能动？都得它自己猜</text>
<text x="64" y="482" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#4457C4">四样都写清楚</text>
<rect x="64" y="540" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="572" width="130" height="84" rx="18" fill="#4457C4"/>
<text x="118" y="590" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">目标</text>
<text x="256" y="570" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#5D6485">要做什么</text>
<text x="256" y="618" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" fill="#202B54">把销售表按月份汇总</text>
<rect x="64" y="708" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="740" width="130" height="84" rx="18" fill="#9471BE"/>
<text x="118" y="758" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">输入</text>
<text x="256" y="738" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#5D6485">材料在哪</text>
<text x="256" y="786" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" fill="#202B54">附件这份销售表</text>
<rect x="64" y="876" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="908" width="130" height="84" rx="18" fill="#DB655A"/>
<text x="118" y="926" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">输出</text>
<text x="256" y="906" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#5D6485">最后要什么</text>
<text x="256" y="954" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" fill="#202B54">做成 Excel，保留公式</text>
<rect x="64" y="1044" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="1076" width="130" height="84" rx="18" fill="#202B54"/>
<text x="118" y="1094" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">约束</text>
<text x="256" y="1074" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#5D6485">有什么要求</text>
<text x="256" y="1122" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" fill="#202B54">日期统一成年月日格式</text>
<path d="M 64 1238 L 1136 1238" fill="none" stroke="#E4E6F1" stroke-width="2"/>
<text x="64" y="1266" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#5D6485">WorkBuddy 提示词 100 例 · 示意图</text>
<text x="960" y="1266" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#4457C4">可以叫我才哥</text>
</svg>