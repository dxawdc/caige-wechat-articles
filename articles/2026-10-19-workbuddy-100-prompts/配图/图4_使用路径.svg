<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220"><rect width="100%" height="100%" fill="#FAFAFE"/>
<rect x="64" y="56" width="96" height="10" rx="5" fill="#DB655A"/>
<text x="64" y="92" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700" fill="#202B54">从一条提示词，到自己的技能</text>
<text x="66" y="176" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" fill="#5D6485">同一句话用到第三次，就值得存下来</text>
<rect x="64" y="250" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="284" width="80" height="80" rx="18" fill="#4457C4"/>
<text x="118" y="300" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">1</text>
<text x="204" y="276" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#202B54">复制一条</text>
<text x="204" y="338" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#5D6485">从 10 类里找到最接近的那条</text>
<path d="M 132 398 L 132 422" fill="none" stroke="#E4E6F1" stroke-width="4"/>
<rect x="64" y="422" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="456" width="80" height="80" rx="18" fill="#4457C4"/>
<text x="118" y="472" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">2</text>
<text x="204" y="448" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#202B54">换掉【】</text>
<text x="204" y="510" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#5D6485">填上自己的文件、读者和要求</text>
<path d="M 132 570 L 132 594" fill="none" stroke="#E4E6F1" stroke-width="4"/>
<rect x="64" y="594" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="628" width="80" height="80" rx="18" fill="#4457C4"/>
<text x="118" y="644" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">3</text>
<text x="204" y="620" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#202B54">先看计划</text>
<text x="204" y="682" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#5D6485">复杂任务先用第 91 条，确认后再做</text>
<path d="M 132 742 L 132 766" fill="none" stroke="#E4E6F1" stroke-width="4"/>
<rect x="64" y="766" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="800" width="80" height="80" rx="18" fill="#4457C4"/>
<text x="118" y="816" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">4</text>
<text x="204" y="792" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#202B54">检查结果</text>
<text x="204" y="854" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#5D6485">用第 95 条让它自查，再自己打开看</text>
<path d="M 132 914 L 132 938" fill="none" stroke="#E4E6F1" stroke-width="4"/>
<rect x="64" y="938" width="1072" height="148" rx="20" fill="#FFFFFF" stroke="#E4E6F1" stroke-width="2"/>
<rect x="92" y="972" width="80" height="80" rx="18" fill="#DB655A"/>
<text x="118" y="988" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">5</text>
<text x="204" y="964" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#202B54">存成技能</text>
<text x="204" y="1026" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" fill="#5D6485">用第 94 条整理成技能，下次一句话调用</text>
<path d="M 64 1128 L 1136 1128" fill="none" stroke="#E4E6F1" stroke-width="2"/>
<text x="64" y="1156" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#5D6485">WorkBuddy 提示词 100 例 · 示意图</text>
<text x="960" y="1156" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#4457C4">可以叫我才哥</text>
</svg>